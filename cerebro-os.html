<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Strategist OS</title>
<style>
:root{
  color-scheme: light;
  --accent:#E42278; --accent-soft:#FDECF4; --accent-deep:#C01560;
  --bg:#F7F6F4; --card:#FFFFFF; --ink:#1A1621; --ink-mid:#5A5262; --ink-muted:#9B94A3;
  --border:#E8E4EC; --ok:#1E9E6A; --warn:#D98B0B; --bad:#D43A3A;
  --tof:#4A7DE0; --mof:#D98B0B; --bof:#1E9E6A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
#app{display:flex;min-height:100vh}
/* ---------- SIDEBAR ---------- */
#sidebar{width:216px;min-width:216px;background:var(--card);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-weight:800;font-size:15px;letter-spacing:-0.02em;padding:4px 8px 2px}
.logo span{color:var(--accent)}
.logo-sub{font-size:10.5px;color:var(--ink-muted);padding:0 8px 10px}
.brand-switch{margin:0 4px 12px}
.brand-switch select{width:100%;padding:8px 10px;border:1.5px solid var(--accent);border-radius:10px;font-weight:700;font-size:13px;color:var(--accent);background:var(--accent-soft);cursor:pointer}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--ink-mid);font-weight:600;font-size:13px;border:none;background:none;text-align:left;width:100%}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .ico{width:18px;text-align:center;font-size:14px}
.nav-sep{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-muted);padding:12px 10px 4px;font-weight:700}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
.side-foot button{flex:1;font-size:11px;padding:6px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;color:var(--ink-mid)}
/* ---------- MAIN ---------- */
#main{flex:1;padding:22px 26px;max-width:1200px;min-width:0}
.view-title{font-size:20px;font-weight:800;letter-spacing:-0.02em;margin-bottom:2px}
.view-sub{color:var(--ink-muted);font-size:12.5px;margin-bottom:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.card h3{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;min-width:110px}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:11px;color:var(--ink-muted);font-weight:600}
/* bars */
.bar-row{margin-bottom:10px}
.bar-label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--ink-mid);margin-bottom:3px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;display:flex}
.bar i{height:100%;display:block}
/* pills & badges */
.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:99px;background:var(--bg);color:var(--ink-mid);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.tof{background:#E7EEFB;color:var(--tof)}.pill.mof{background:#FBF1DE;color:var(--mof)}.pill.bof{background:#E2F5EC;color:var(--bof)}
.pill.ok{background:#E2F5EC;color:var(--ok)}.pill.warn{background:#FBF1DE;color:var(--warn)}.pill.bad{background:#FBE5E5;color:var(--bad)}
/* buttons */
.btn{border:none;border-radius:9px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--card);color:var(--ink-mid);border:1px solid var(--border)}
.btn.ghost{background:transparent;color:var(--accent);border:1px dashed var(--accent)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.ai{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff}
.btn.ai::before{content:"✦ "}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #F2CBCB}
/* list items */
.item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--card);cursor:pointer;transition:border-color .12s}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;font-size:13.5px;margin-bottom:4px}
.item .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.item .desc{font-size:12px;color:var(--ink-mid)}
/* forms */
label{display:block;font-size:11px;font-weight:700;color:var(--ink-mid);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
/* modal */
#modal-bg{position:fixed;inset:0;background:rgba(20,15,25,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
#modal-bg.open{display:flex}
#modal{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
#modal h2{font-size:16px;font-weight:800;margin-bottom:6px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow-x:auto}
.kcol{background:var(--bg);border-radius:12px;padding:8px;min-height:120px}
.kcol h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mid);padding:4px 6px 8px;display:flex;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:7px;font-size:12px}
.kcard .kt{font-weight:700;margin-bottom:3px;cursor:pointer}
.kmove{display:flex;justify-content:space-between;margin-top:6px}
.kmove button{border:none;background:var(--bg);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11px;color:var(--ink-mid)}
/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--ink-mid)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ad editor */
.ad-row{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:7px;cursor:pointer}
.ad-row.sel{border-color:var(--accent);background:var(--accent-soft)}
.ad-row .an{font-weight:700;font-size:12.5px;flex:1}
.naming{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--bg);padding:8px 10px;border-radius:8px;word-break:break-all;color:var(--ink-mid);display:flex;justify-content:space-between;gap:8px;align-items:center}
.cb-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cb{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--bg);border-radius:8px;padding:7px 9px;cursor:pointer}
.cb input{width:auto}
.hook-line{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.hook-line input{flex:1}
.hook-line .x{border:none;background:none;color:var(--bad);cursor:pointer;font-weight:800}
.hint{font-size:11.5px;color:var(--ink-muted);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px}
.sugg{border-left:3px solid var(--accent);padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:12.5px}
.sugg b{color:var(--accent)}
/* AI result */
#ai-out{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font-size:12.5px;max-height:340px;overflow-y:auto;margin-top:10px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* manual */
details{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--card)}
details summary{padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer;list-style:none}
details summary::before{content:"▸ ";color:var(--accent)}
details[open] summary::before{content:"▾ "}
details .dbody{padding:0 16px 14px;font-size:12.5px;color:var(--ink-mid)}
details .dbody ul{padding-left:18px;margin:6px 0}
details .dbody li{margin-bottom:4px}
.empty{text-align:center;color:var(--ink-muted);padding:26px;font-size:13px;border:1.5px dashed var(--border);border-radius:12px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.small{font-size:11.5px;color:var(--ink-muted)}
h4.sec-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mid);margin:16px 0 8px}
/* chat */
#chat-log{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:calc(100vh - 300px);min-height:220px;overflow-y:auto;padding:4px}
.msg{max-width:84%;padding:11px 14px;border-radius:14px;font-size:13px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg details summary{cursor:pointer;list-style:none}
.msg details summary b{color:var(--accent)}
.msg .msg-full{white-space:pre-wrap;margin-top:8px;font-size:12px;color:var(--ink-mid);max-height:300px;overflow-y:auto}
.chat-bar{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:10px 0 2px}
.chat-bar select{width:160px;font-size:12px}
.chat-bar textarea{flex:1;min-height:64px;max-height:220px}
.chat-hint{font-size:11px;color:var(--ink-muted);margin-top:4px}
.gtag{display:inline-flex;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-right:4px}
.gtag.Winner{background:#E2F5EC;color:var(--ok)}.gtag.Propio{background:var(--accent-soft);color:var(--accent)}
.gtag.Competencia{background:#FBF1DE;color:var(--warn)}.gtag.Idea{background:#E7EEFB;color:var(--tof)}
.gtag.Análisis{background:#F1EAFB;color:#7C3AED}.gtag.Referencia{background:var(--bg);color:var(--ink-mid)}
</style>
<style id="addna-dark">
:root{color-scheme:dark;--bg:#0A0D14;--card:#11151F;--ink:#E6E9F0;--ink-mid:#A6ADBF;--ink-muted:#707A8F;--border:#1E2430}
.nav-item.active,.pill.acc,.ad-row.sel,.brand-switch select{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.msg.user{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
input[type=text],input[type=number],textarea,select{background:#161B28;color:var(--ink);border-color:#1E2430}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.spinner{border-color:color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent)}
.tab.active{background:#E6E9F0;color:#0A0D14;border-color:#E6E9F0}
.pill.tof{background:rgba(74,125,224,.16);color:#7FA6F0}
.pill.mof{background:rgba(217,139,11,.16);color:#FBBF24}
.pill.bof,.pill.ok{background:rgba(52,211,153,.16);color:#34D399}
.pill.warn{background:rgba(251,191,36,.16);color:#FBBF24}
.pill.bad{background:rgba(248,113,113,.16);color:#F87171}
.gtag.Winner{background:rgba(52,211,153,.16);color:#34D399}
.gtag.Propio{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.gtag.Competencia{background:rgba(251,191,36,.16);color:#FBBF24}
.gtag.Idea{background:rgba(74,125,224,.16);color:#7FA6F0}
.gtag.Análisis{background:rgba(167,139,250,.16);color:#A78BFA}
.gtag.Referencia{background:#161B28;color:var(--ink-mid)}
#modal-bg{background:rgba(0,0,0,.65)}
.kcol{background:#0E121B}
.side-foot button,.btn.sec{background:var(--card);color:var(--ink-mid);border:1px solid var(--border)}
.btn.danger{border-color:rgba(248,113,113,.4)}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">Creative<span>Strategist</span> OS</div>
    <div class="logo-sub">Tu mano derecha de estrategia</div>
    <div class="brand-switch"><select id="brand-sel" onchange="switchBrand(this.value)"></select></div>
    <button class="nav-item" data-v="chat" onclick="nav('chat')"><span class="ico">✦</span>Chat estratégico</button>
    <button class="nav-item" data-v="dash" onclick="nav('dash')"><span class="ico">◉</span>Dashboard</button>
    <button class="nav-item" data-v="brain" onclick="nav('brain')"><span class="ico">🧠</span>Brand Brain</button>
    <button class="nav-item" data-v="guiones" onclick="nav('guiones')"><span class="ico">📜</span>Guiones</button>
    <button class="nav-item" data-v="ideas" onclick="nav('ideas')"><span class="ico">💡</span>Ideas</button>
    <button class="nav-item" data-v="conj" onclick="nav('conj')"><span class="ico">▦</span>Conjuntos</button>
    <button class="nav-item" data-v="est" onclick="nav('est')"><span class="ico">🖼</span>Estáticos</button>
    <button class="nav-item" data-v="plan" onclick="nav('plan')"><span class="ico">🗓</span>Planificación</button>
    <button class="nav-item" data-v="iter" onclick="nav('iter')"><span class="ico">♻</span>Iteración</button>
    <div class="nav-sep">Herramientas</div>
    <button class="nav-item" data-v="search" onclick="nav('search')"><span class="ico">🔍</span>Búsqueda</button>
    <button class="nav-item" data-v="manual" onclick="nav('manual')"><span class="ico">📖</span>Manual del sistema</button>
    <button class="nav-item" onclick="addBrand()"><span class="ico">＋</span>Nueva marca</button>
    <div class="side-foot">
      <button onclick="exportData()">Exportar</button>
      <button onclick="importData()">Importar</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-bg" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>
<input type="file" id="import-file" accept=".json" style="display:none">

<script>
/* ============================================================
   CONSTANTES DEL SISTEMA (condensado de los 7 frameworks)
============================================================ */
const AWARENESS=[
 {id:'unaware',label:'Inconsciente',funnel:'TOF'},
 {id:'problem',label:'Consciente del problema',funnel:'TOF'},
 {id:'solution',label:'Consciente de la solución',funnel:'MOF'},
 {id:'product',label:'Consciente del producto',funnel:'MOF'},

 unaware:'Skits, edutainment, ASMR, POV, meme nativo, estadística bold, historia del founder',

const TIPO_APUESTA=[{id:'gs',label:'Iteración de Grand Slam',target:20},{id:'promesa',label:'Iteración de promesa/low-profile',target:60},{id:'apuesta',label:'Apuesta nueva (big swing)',target:20}];
const ESTADOS=['Idea','Brief','Producción','Lanzado','Analizando','Iterando'];
const HOOK_TYPES=['Agitación de problema','Verdad contraria','Prueba específica','Curiosity gap','Truth bomb','Confrontación','Sensorial/ASMR','Carta del founder','Prueba social'];
const COPY_BLOCKS=[{id:'dolor',label:'Dolor'},{id:'promesa',label:'Promesa'},{id:'prueba',label:'Prueba'},{id:'restricciones',label:'Objeciones'},{id:'curiosidad',label:'Curiosidad/Mecanismo'},{id:'condiciones',label:'Urgencia/Condiciones'}];
const BLOCK_TYPES=['Hook','Escena de problema','Prueba/Social proof','Mecanismo','CTA','Ángulo validado','Aprendizaje (loser)'];
const WINNER_TYPES=[
 {id:'falso',label:'Falso ganador',play:'No relances esperando el día 1. Rescata los bloques validados (hook con buen hook-rate, escena con buena retención) al repositorio y archívalo. Invertir iteración aquí es el error más caro.'},

];

/* ============================================================
   SEED — marcas precargadas
============================================================ */

   {id:'h2',texto:'21,000 mujeres confiaron primero. Hoy es tu turno.',tipo:'Prueba social'},
   {id:'h3',texto:'Lo que pasa debajo de tu piel (y nadie te explicó).',tipo:'Curiosity gap'},
   {id:'h4',texto:'Vuelve a las blusas que dejaste.',tipo:'Agitación de problema'}

const KEY='csos_state_v1';
let state;
try{ state=JSON.parse(localStorage.getItem(KEY))||seedState(); }catch(e){ state=seedState(); }
if(!state.brands||!Object.keys(state.brands).length) state=seedState();
Object.values(state.brands).forEach(b=>{ b.chat=b.chat||[]; b.guiones=b.guiones||[]; b.estilo=b.estilo||''; b.stcSets=b.stcSets||[]; b.stcSeq=b.stcSeq||0; (b.conjuntos||[]).forEach(c=>{ if(!c.copy)c.copy={primarios:[],headlines:[],descripciones:[],cta:'Comprar ahora'}; if(c.lanz==null){const m=/lanzamiento:?\s*(\d{1,2})\s*(?:de\s*)?([a-záéíóú]{3})/i.exec(c.notas||'');c.lanz=m?(m[1]+m[2].normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase()):'';} }); });
if(!state.ui.view) state.ui.view='chat';
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
function B(){ return state.brands[state.activeBrand]; }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function awLabel(id){ const a=AWARENESS.find(x=>x.id===id); return a?a.label:id; }
function awFunnel(id){ const a=AWARENESS.find(x=>x.id===id); return a?a.funnel:''; }
function pilLabel(id){ const p=PILARES.find(x=>x.id===id); return p?p.label:id; }

function allAds(){ return B().conjuntos.flatMap(c=>c.ads.map(a=>({...a,conj:c}))); }
function pct(n,t){ return t?Math.round(n/t*100):0; }
function vDash(){
 const b=B(), ads=allAds();
 const fun={TOF:0,MOF:0,BOF:0}; ads.forEach(a=>{const f=awFunnel(a.awareness); if(f)fun[f]++;});
 const pil={ih:0,ugc:0,ai:0}; ads.forEach(a=>{if(pil[a.pilar]!=null)pil[a.pilar]++;});
 const mix={gs:0,promesa:0,apuesta:0}; b.conjuntos.forEach(c=>{if(mix[c.tipoApuesta]!=null)mix[c.tipoApuesta]++;});
 const totC=b.conjuntos.length;
 const sugg=buildSuggestions(ads,fun,pil,mix,totC);
 return `
 <div class="view-title">${esc(b.name)} — Dashboard</div>
 <div class="view-sub">Estado del sistema creativo. La estrategia = priorizar el siguiente movimiento más impactante.</div>
 <div class="stat-row">
  <div class="stat"><div class="n">${b.ideas.length}</div><div class="l">Ideas en backlog</div></div>
  <div class="stat"><div class="n">${totC}</div><div class="l">Conjuntos</div></div>
  <div class="stat"><div class="n">${ads.length}</div><div class="l">Ads planeados</div></div>
  <div class="stat"><div class="n">${b.winners.filter(w=>w.tipo==='gs').length}</div><div class="l">Grand Slams</div></div>
  <div class="stat"><div class="n">${b.blocks.length}</div><div class="l">Building blocks</div></div>
 </div>
 <div class="grid g2">
  <div class="card"><h3>Balance de embudo <span class="small">meta: 70-90% TOF</span></h3>
   ${barRow('TOF · descubrimiento',fun.TOF,ads.length,'var(--tof)')}
   ${barRow('MOF · consideración',fun.MOF,ads.length,'var(--mof)')}
   ${barRow('BOF · conversión',fun.BOF,ads.length,'var(--bof)')}
  </div>
  <div class="card"><h3>Regla 33% — pilares <span class="small">meta: ~33% c/u</span></h3>
   ${barRow('In-house',pil.ih,ads.length,'var(--accent)')}
   ${barRow('UGC',pil.ugc,ads.length,'#8B5CF6')}
   ${barRow('IA',pil.ai,ads.length,'#0EA5E9')}
  </div>
 </div>
 <div class="grid g2 mt">
  <div class="card"><h3>Mix semanal <span class="small">meta: 20 / 60 / 20</span></h3>
   ${barRow('Iteración Grand Slam (20%)',mix.gs,totC,'var(--ok)')}
   ${barRow('Iteración promesa (60%)',mix.promesa,totC,'var(--warn)')}
   ${barRow('Apuesta nueva (20%)',mix.apuesta,totC,'var(--accent)')}
  </div>
  <div class="card"><h3>Siguiente movimiento sugerido</h3>
   ${sugg.length?sugg.map(s=>`<div class="sugg">${s}</div>`).join(''):'<div class="empty">Todo balanceado. Sigue produciendo volumen sobre la barra de calidad.</div>'}
  </div>
 </div>
 <div class="card mt"><h3>Acciones rápidas</h3>
  <div class="flex">
   <button class="btn" onclick="newConjunto()">＋ Nuevo conjunto</button>
   <button class="btn sec" onclick="newIdea()">＋ Capturar idea</button>
   <button class="btn sec" onclick="nav('iter')">Clasificar un ganador</button>
   <button class="btn ai" onclick="promptForChat()">Pedir a Claude en el chat</button>
  </div>
 </div>`;
}
function barRow(label,n,t,color){
 const p=pct(n,t);
 return `<div class="bar-row"><div class="bar-label"><span>${label}</span><span>${n} · ${p}%</span></div><div class="bar"><i style="width:${p}%;background:${color}"></i></div></div>`;
}
function buildSuggestions(ads,fun,pil,mix,totC){
 const s=[];
 if(!ads.length){ s.push('<b>Empieza aquí:</b> crea tu primer conjunto. Cada conjunto = 1 concepto (persona + ángulo + oferta) con 3-5 ads que cubran distintos niveles de conciencia.'); return s; }
 const tofP=pct(fun.TOF,ads.length);
 if(tofP<60) s.push(`<b>Te falta TOF (${tofP}%).</b> 70-90% del volumen debe ser top of funnel: educativo, historia de founder, estadísticas bold, skits. Si sobrealimentas BOF, el embudo se seca.`);
 if(pct(fun.BOF,ads.length)===0&&ads.length>4) s.push('<b>Sin ads BOF.</b> Andromeda secuencia por conciencia — agrega oferta directa/escasez/testimonios para cerrar a los que ya vieron todo lo demás.');
 const skewPil=Object.entries(pil).filter(([k,v])=>pct(v,ads.length)>55);
 if(skewPil.length) s.push(`<b>Pilar desbalanceado:</b> ${pilLabel(skewPil[0][0])} concentra ${pct(skewPil[0][1],ads.length)}%. La regla 33% exige mezcla de in-house (confianza), UGC (autenticidad+volumen) e IA (velocidad de testeo).`);
 if(totC>2&&pct(mix.apuesta,totC)>40) s.push(`<b>Demasiadas apuestas nuevas (${pct(mix.apuesta,totC)}%).</b> El dinero está en iterar: 60% del esfuerzo va a convertir promesas/low-profiles en grand slams.`);
 if(totC>2&&mix.gs===0&&B().winners.some(w=>w.tipo==='gs')) s.push('<b>Tienes Grand Slams sin iterar.</b> Cada ganador debe tener su escalera corriendo (hook refresh → guión → caster → spin-offs) ANTES de que fatigue.');
 const fewHooks=ads.filter(a=>(a.hooks||[]).length<3&&a.formato&&a.formato.includes('Video'));
 if(fewHooks.length) s.push(`<b>${fewHooks.length} video(s) con menos de 3 hooks.</b> El hook es el 80% del resultado — 2 cuerpos con 15 hooks le gana a 5 cuerpos con 2 hooks.`);
 const noHip=B().conjuntos.filter(c=>!c.hipotesis);
 if(noHip.length) s.push(`<b>${noHip.length} conjunto(s) sin hipótesis.</b> Sin hipótesis no estás testeando, estás apostando. Escribe qué esperas validar y con qué variable.`);
 return s.slice(0,4);
}

/* generic form modal */
function formModal(title,fields,initial,onSave,onDelete){
 const m=document.getElementById('modal');
 m.innerHTML=`<h2>${esc(title)}</h2>`+fields.map(f=>{
  const v=initial&&initial[f.k]!=null?initial[f.k]:(f.def||'');
  if(f.type==='textarea')return `<label>${f.label}</label><textarea id="f_${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  if(f.type==='select')return `<label>${f.label}</label><select id="f_${f.k}">${f.options.map(o=>{const val=typeof o==='string'?o:o.v,lab=typeof o==='string'?o:o.l;return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select>`;
  return `<label>${f.label}</label><input type="text" id="f_${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;

function copyText(t){
 t=String(t==null?'':t); let ok=false;
 try{
  const ta=document.createElement('textarea');
  ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
  document.body.appendChild(ta); ta.focus(); ta.select(); if(ta.setSelectionRange)ta.setSelectionRange(0,t.length);
  ok=document.execCommand('copy');
  document.body.removeChild(ta);
 }catch(e){ ok=false; }
 if(navigator.clipboard&&navigator.clipboard.writeText){ try{navigator.clipboard.writeText(t).then(null,function(){ if(!ok)copyFallback(t); }); if(!ok)ok=true; }catch(e){} }
 if(!ok)copyFallback(t);
 return ok;
}

function vManual(){
 return `<div class="view-title">Manual del sistema</div><div class="view-sub">El sistema condensado de los 7 frameworks. El sistema es el multiplicador; la persona es la variable.</div>
 <details open><summary>1 · El creativo es el targeting</summary><div class="dbody">Media buying está automatizado. El creativo que subes ES la segmentación: Andromeda lee el transcript, el casting y el problema que agitas para decidir a quién mostrarlo. Ads similares se agrupan (bundling) y saturan a la misma gente → frecuencia sube, reach baja, ROAS cae. Diversidad de conceptos = audiencias nuevas.</div></details>
 <details><summary>2 · Concepto = Persona + Ángulo + Oferta (+ Formato)</summary><div class="dbody">Prioridad de testeo: <b>ángulo &gt; oferta &gt; persona &gt; formato</b>. La mayoría lo hace al revés (testean formatos). Personas hiper-específicas — problemas, deseos y triggers de compra, no demografías. 1 concepto = 1 adset. Si mezclas conceptos en un adset, no aprendes nada.</div></details>
 <details><summary>3 · Regla 33% + embudo completo (Chase)</summary><div class="dbody"><ul><li>Pilares: 33% in-house (confianza/founder) · 33% UGC (autenticidad+volumen, creator army) · 33% IA (velocidad de testeo barata).</li><li>Embudo DENTRO del mismo adset: educacional/stats (inconsciente) → founder story/PAS (problema) → 3 razones/us-vs-them (solución) → social proof/testimonios (producto) → oferta directa/escasez (más consciente).</li><li>2027: formatos únicos por conjunto, NO variantes de un ganador. Gasto nivelado entre creativos = señal de que lo hiciste bien. No apagues los "malos" si el adset pega KPI — Meta los usa en la secuencia.</li></ul></div></details>
 <details><summary>4 · Hooks y copy (CASH + Copy Blocks + GBP)</summary><div class="dbody"><ul><li><b>CASH:</b> Concepto → Ángulo → Estilo → Hook. ~300-400 hechos por marca × ángulos × estilos = ideas infinitas.</li><li><b>Copy blocks:</b> Dolor, Promesa, Prueba, Restricciones (objeciones/identidad/recursos), Curiosidad (mecanismo con nombre), Condiciones (urgencia). Más bloques por palabra = mayor copy velocity.</li><li><b>GBP:</b> Gut (2s, instinto) → Brain (explica el concepto; producto LO MÁS TARDE posible; cuida el puente — no saltes de educación a venta) → Pocket (CTA claro).</li><li>Hook = 80%: 2 cuerpos + 15 hooks &gt; 5 cuerpos + 2 hooks. Calificar: claridad, relevancia (agita problema &gt; persona call-out), novedad, especificidad, credibilidad.</li></ul></div></details>
 <details><summary>5 · Niveles de conciencia y sofisticación</summary><div class="dbody">Schwartz: Inconsciente → Problema → Solución → Producto → Más consciente. Presupuesto/volumen: <b>70-90% TOF, ~20% MOF, 5-10% BOF</b>. Sofisticación del mercado: 1 nuevo ("existe") → 2 competir ("más X") → 3 mecanismo → 4 mecanismo elaborado → 5 identidad. Leer mal la etapa = ads muertos aunque el producto sea bueno.</div></details>
 <details><summary>6 · Testing (Alessio)</summary><div class="dbody"><ul><li>Testing = comprar DATA. Scaling = comprar profit. Campañas separadas.</li><li>ABO testing: 1 concepto = 1 adset, 3-5 variantes, misma inversión. Cambia UNA variable.</li><li>Graduación: ~$900 spend + 10 conversiones a KPI → escalar. Stop-loss: 2× CPA objetivo sin conversión → matar.</li><li>Escalar: +20% cada 24-48h. NUNCA apagues un ganador para "moverlo".</li><li>Métricas por confiabilidad: <b>spend</b> (lo que Meta respalda) &gt; ROAS 7-day-click &gt; CTR/CPC &gt; hook/hold rate (diagnóstico). ROAS a nivel ad NO es confiable (secuenciación multi-touch).</li><li>Volumen: ~1 ad nuevo por cada $1K de spend mensual. Presupuesto creativo: 25% del media budget (30-100K) → 10% (100K+).</li></ul></div></details>
 <details><summary>7 · Iteración y ganadores</summary><div class="dbody"><ul><li>Mix semanal: <b>20% iteración de Grand Slams / 60% iteración de promesas / 20% apuestas</b>.</li><li>Falso ganador: día 1 espectacular, colapsa al escalar → rescata bloques, archiva.</li><li>Low-profile: rentable a $50-200/día, se ahoga al escalar → déjalo en su sweet spot + cirugía de un bloque. 10 low-profiles = base estable.</li><li>Grand Slam: aguanta escala → protege el original, escala con la escalera (hook refresh → guión → caster → spin-offs).</li><li>Regla 20% especulación: 80% bloques validados + 20% apuesta nombrada.</li><li>Retención: 3s→25% cae = hook promete y no entrega; 25→50% = cuerpo aburre; 75%→fin = oferta débil.</li></ul></div></details>
 <details><summary>8 · Portfolio y fatiga</summary><div class="dbody">Todo ad fatiga y tiene capacidad máxima de spend. 3 ads sosteniendo $1K/día &gt; 1 ad sosteniendo $1K/día (riesgo). Pareto: 4% de los ads sostienen ~64% del spend — por eso el pipeline nunca para. Frecuencia &gt;2 en frío = falta diversidad/volumen. El banco de iteraciones se construye ANTES de que el ganador fatigue.</div></details>
 <details><summary>9 · El flywheel semanal</summary><div class="dbody">Analizar (spend primero) → Preservar (bloques al Brand Brain, también los losers) → Planear (mix 20/60/20) → Producir (briefs sin ambigüedad, referencias, naming convention) → Lanzar → repetir. Research primero interno (tu cuenta, tus reviews), luego audiencia (Reddit, lenguaje literal), al final competencia (patrones repetidos = validados; indirectos = innovación).</div></details>`;
}

 return `Eres el motor de extracción y co-estratega de un Creative Strategist OS. Recibes mensajes del usuario: análisis completos de creativos, guiones, ideas, notas estratégicas o preguntas. Tienes adjunto el contexto de marca.
${tag&&tag!=='auto'?'El usuario etiquetó este mensaje como: '+tag+'.':''}
RESPONDE ÚNICAMENTE con JSON válido (sin markdown, sin backticks, sin texto fuera del JSON) con exactamente esta forma:
{"reply":"","tipo_detectado":"","guion":{"titulo":"","texto":"","hook":"","formato":"","awareness":"","score":"","notas":""},"hooks":[],"blocks":[{"tipo":"","contenido":"","perf":""}],"objeciones":[{"objecion":"","respuesta":""}],"ideas":[{"titulo":"","concepto":"","hook":""}],"winner":null,"persona_insight":"","estilo":""}
REGLAS:
- reply: en español. Si el mensaje aporta información: resume en 2-3 frases qué guardaste + 1 observación estratégica aguda. Si es una pregunta o petición creativa: la respuesta COMPLETA va aquí (usa el contexto de marca).
- tipo_detectado: analisis | guion_propio | guion_competencia | idea | winner | nota | pregunta.
- guion.texto: el guion o análisis ÍNTEGRO si el mensaje contiene uno (copia el guion literal); "" si no. titulo: corto y descriptivo. hook: el hook principal textual. awareness: unaware|problem|solution|product|most o "".
- hooks: máximo 6 frases textuales aprovechables (hooks probados, variantes de apertura, headlines). Solo las mejores.
- blocks: máximo 6 elementos REUTILIZABLES y autocontenidos (receta ganadora, qué mantener, mecanismos de scroll-stop, gatillos con score, estructuras). tipo: Hook | Escena de problema | Prueba/Social proof | Mecanismo | CTA | Ángulo validado | Aprendizaje (loser) | Insight de audiencia. perf: dato de performance si existe (score, hook rate, spend).
- objeciones: pares objeción→cómo se neutraliza, solo si el mensaje las revela.
- ideas: solo si el mensaje propone cosas a probar ("QUÉ PROBAR") o si el usuario pidió ideas.
- winner: {"nombre":"","tipo":"gs|low|falso","notas":""} SOLO si el mensaje declara un ganador (score alto, "winner", "me ganó"). tipo gs si es claro ganador escalable.
- persona_insight: 1-2 frases NUEVAS sobre el avatar/persona (dolor, deseo, identidad) que el mensaje revele, o "".
- estilo: 1 frase sobre el estilo de comunicación observado en el guion (tono, ritmo, estructuras) o "".
- Extrae SOLO lo presente. No inventes datos. Arrays vacíos si no aplica.`;
}
function parseExtraction(raw){
 if(!raw)return null;
 let s=String(raw).trim().replace(/^```(json)?/i,'').replace(/```\s*$/,'').trim();
 const i=s.indexOf('{'),j=s.lastIndexOf('}');
 if(i<0||j<=i)return null;
 try{ return JSON.parse(s.slice(i,j+1)); }catch(e){ return null; }
}
function applyExtraction(res,orig,tag,opts){
 opts=opts||{}; const b=B(),chips=[];
 const userTag=normTag(tag);
 // guion
 if(!opts.skipGuion){
  const hasGuion=res.guion&&(res.guion.texto||'').length>40;
  const shouldStore=hasGuion||['Winner','Propio','Competencia','Análisis'].includes(userTag)||['analisis','guion_propio','guion_competencia','winner'].includes(res.tipo_detectado);
  if(shouldStore){
   const tags=[];
   if(userTag)tags.push(userTag);
   const td=res.tipo_detectado||'';
   if(td==='winner'&&!tags.includes('Winner'))tags.push('Winner');
   if(td==='guion_propio'&&!tags.includes('Propio')&&!tags.includes('Winner'))tags.push('Propio');
   if(td==='guion_competencia'&&!tags.includes('Competencia'))tags.push('Competencia');
   if(td==='analisis'&&!tags.length)tags.push('Análisis');
   if(res.winner&&!tags.includes('Winner'))tags.push('Winner');
   if(!tags.length)tags.push('Referencia');
   b.guiones.push({id:uid(),titulo:(res.guion&&res.guion.titulo)||orig.split('\n')[0].slice(0,70),texto:(res.guion&&res.guion.texto&&res.guion.texto.length>40)?res.guion.texto:orig,hook:(res.guion&&res.guion.hook)||'',formato:(res.guion&&res.guion.formato)||'',awareness:(res.guion&&res.guion.awareness)||'',score:(res.guion&&res.guion.score)||'',notas:(res.guion&&res.guion.notas)||'',tags:[...new Set(tags)],fecha:Date.now(),full:orig});
   chips.push('📜 Guion → biblioteca ('+[...new Set(tags)].join(', ')+')');
  }
 }
 // hooks
 let nh=0;(res.hooks||[]).forEach(h=>{h=String(h||'').trim().replace(/^["'"]+|["'"]+$/g,'');if(h.length>4&&h.length<220&&!b.hooks.some(x=>x.texto.toLowerCase()===h.toLowerCase())){b.hooks.push({id:uid(),texto:h,tipo:''});nh++;}});
 if(nh)chips.push('+'+nh+' hooks');
 // blocks
 let nb=0;(res.blocks||[]).forEach(x=>{const c=String((x&&x.contenido)||'').trim();if(c.length>8&&!b.blocks.some(y=>y.contenido.toLowerCase()===c.toLowerCase())){b.blocks.push({id:uid(),tipo:(x.tipo&&String(x.tipo).slice(0,40))||'Ángulo validado',contenido:c,origen:opts.origen||'Chat',perf:String((x&&x.perf)||'')});nb++;}});
 if(nb)chips.push('+'+nb+' building blocks');
 // objeciones
 let no=0;(res.objeciones||[]).forEach(o=>{const q=String((o&&o.objecion)||'').trim();if(q.length>3&&!b.objeciones.some(y=>y.objecion.toLowerCase()===q.toLowerCase())){b.objeciones.push({id:uid(),objecion:q,respuesta:String((o&&o.respuesta)||'')});no++;}});
 if(no)chips.push('+'+no+' objeciones');
 // ideas
 let ni=0;(res.ideas||[]).forEach(i=>{const t=String((i&&i.titulo)||'').trim();if(t.length>3){b.ideas.push({id:uid(),titulo:t,concepto:String((i&&i.concepto)||''),hook:String((i&&i.hook)||''),angulo:'',epic:'',awareness:'',formato:'',pilar:'',score:5,notas:'Origen: chat estratégico',createdAt:Date.now()});ni++;}});
 if(ni)chips.push('+'+ni+' ideas');
 // winner
 if(res.winner&&res.winner.nombre){
  b.winners.push({id:uid(),nombre:String(res.winner.nombre).slice(0,90),tipo:['gs','low','falso'].includes(res.winner.tipo)?res.winner.tipo:'gs',notas:String(res.winner.notas||''),fecha:Date.now()});
  chips.push('🏆 Winner clasificado');
 }
 // persona insight
 if(res.persona_insight&&String(res.persona_insight).length>10){
  b.blocks.push({id:uid(),tipo:'Insight de audiencia',contenido:String(res.persona_insight),origen:opts.origen||'Chat',perf:''});
  chips.push('👤 Insight de audiencia');
 }
 // estilo
 if(res.estilo&&String(res.estilo).length>8){
  b.estilo=((b.estilo?b.estilo+'\n':'')+'· '+String(res.estilo)).split('\n').slice(-14).join('\n');
  chips.push('🎙 Estilo actualizado');
 }
 return chips;
}
async function sendChat(){
 const ta=document.getElementById('chat-ta');
 const tagSel=document.getElementById('chat-tag');
 const text=(ta?ta.value:'').trim(); if(!text)return;
 const tag=tagSel?tagSel.value:'auto';
 const b=B();
 b.chat.push({id:uid(),role:'user',text,tag,ts:Date.now()});
 if(b.chat.length>100)b.chat=b.chat.slice(-100);
 const pend={id:uid(),role:'ai',pending:true};
 b.chat.push(pend); save(); renderAll();
 let raw='';
 try{
  if(window.cowork&&window.cowork.askClaude){
   const r=await window.cowork.askClaude(extractionPrompt(tag),[brandCtx(),'MENSAJE DEL USUARIO:\n'+text]);
   raw=typeof r==='string'?r:(r&&(r.text||r.response||r.content))||JSON.stringify(r);
  }
 }catch(e){ raw=''; }
 const bb=B();
 bb.chat=bb.chat.filter(m=>m.id!==pend.id);
 const res=parseExtraction(raw);
 if(res){
  const chips=applyExtraction(res,text,tag,{origen:'Chat '+new Date().toLocaleDateString()});
  bb.chat.push({id:uid(),role:'ai',text:res.reply||'Procesado y guardado.',chips,ts:Date.now()});
 }else if(raw){
  const chips=fallbackStore(text,tag);
  bb.chat.push({id:uid(),role:'ai',text:raw.slice(0,2500),chips,ts:Date.now()});
 }else{
  const chips=fallbackStore(text,tag);
  bb.chat.push({id:uid(),role:'ai',text:'⚠️ El chat IA se conecta cuando AdDNA tenga su propia API key de Claude. Todo lo demás del OS funciona normal — pega aquí tus análisis manualmente y usa el resto de las vistas.',chips,ts:Date.now()});
 }
 save(); renderAll();
}
function fallbackStore(text,tag){
 const b=B(),userTag=normTag(tag)||'Referencia';
 if(text.length>60){
  b.guiones.push({id:uid(),titulo:text.split('\n')[0].slice(0,70),texto:text,tags:[userTag],hook:'',formato:'',awareness:'',score:'',notas:'',fecha:Date.now(),full:text});
  return ['📜 Guardado en Guiones ('+userTag+')'];
 }
 return [];
}

function fillT(s){ const cn=canonB(); return String(s||'').replace(/\{PRUEBA\}/g,cn.prueba).replace(/\{GARANTIA\}/g,cn.garantia).replace(/\{PRODUCTO\}/g,cn.producto).replace(/\{CTA\}/g,cn.cta).replace(/\{ZONAS\}/g,cn.zonas); }
function prefillStatic(f){
 const b=B(); const base=Object.assign({},f.def,(b.id==='skinglow'&&f.sg)||{});
 return {headline:fillT(base.headline),subhead:fillT(base.subhead),elementos:fillT((base.elementos||[]).join('\n')),prueba:fillT(base.prueba||''),oferta:fillT(base.oferta||''),cta:fillT(base.cta||'')};
}

async function aiPrefillStatic(fmtId){
 const f=STATIC_FORMATS.find(x=>x.id===fmtId);
 const cid=document.getElementById('st_conj').value; const c=cid?getConj(cid):null;
 const btn=document.getElementById('st_ai'); if(btn)btn.textContent='Pensando…';
 const prompt=`Eres un creative strategist + copywriter de élite. Contexto de marca adjunto (hooks ganadores, building blocks, voz, prohibidos — úsalo todo).
FORMATO DE ESTÁTICO: ${f.nombre} — ${f.desc} Transmite: ${f.transmite}
${c?conjCtx(c):'Sin conjunto — alinear solo a la marca y sus patrones ganadores.'}
Llena los campos del estático. RESPONDE SOLO JSON válido:
{"headline":"","subheadline":"","elementos":["",""],"prueba":"","oferta":"","cta":""}
Reglas: headline con patrón ganador de la marca (identity mirror, tabú suave, benchmark negativo, quote de arrepentimiento invertido — según el formato); elementos según la anatomía del formato (callouts/cards/filas); números canon de la marca; español mexicano; PROHIBIDO: "blanquea","elimina","100%","cura","milagros".`;
 const res=await aiJson(prompt);
 if(btn)btn.textContent='Prellenar con IA';
 if(res&&res.json){
  const j=res.json;
  if(j.headline)document.getElementById('st_headline').value=j.headline;
  if(j.subheadline!=null)document.getElementById('st_sub').value=j.subheadline;
  if(j.elementos)document.getElementById('st_elem').value=(j.elementos||[]).join('\n');
  if(j.prueba!=null)document.getElementById('st_prueba').value=j.prueba;
  if(j.oferta!=null)document.getElementById('st_oferta').value=j.oferta;
  if(j.cta)document.getElementById('st_cta').value=j.cta;
 }else alert('IA inline no disponible — llena los campos a mano o pídeme el prellenado en el chat principal.');
}

  estilo:{colores:v.colores,tipografia:v.tipografia,layout:v.layout},
  producto_render:v.producto,
  compliance:{reglas:v.compliance,prohibidos_de_marca:b.prohibidos,idioma:'Todo texto visible en ESPAÑOL únicamente'},
  instruccion_final:'Diseña un anuncio estático publicitario siguiendo EXACTAMENTE esta dirección: respeta la jerarquía visual, las zonas con sus proporciones, los hex de color, la tipografía y las specs de render del producto. No inventes claims ni textos nuevos. Anti-leak: los códigos hex, porcentajes y nombres de campo son parámetros de estilo — NO los renderices como texto visible en la imagen.'

function applyDesignPatch(){

}
function applyPacks(){
 DATA_PACKS.forEach(p=>{
  const b=state.brands[p.brand]; if(!b)return;
  b.packs=b.packs||[];
